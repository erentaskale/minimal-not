<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Not</title>
  <meta name="description" content="Karanlık temalı, dikkat dağıtmayan minimalist not alma uygulaması.">
  <meta name="theme-color" content="#0f0f10">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Link paylaşılınca (WhatsApp, LinkedIn vb.) görünen önizleme -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Minimal Not">
  <meta property="og:description" content="Karanlık temalı, dikkat dağıtmayan minimalist not alma uygulaması.">
  <meta property="og:url" content="https://erentaskale.github.io/minimal-not/">

  <!-- Seçili temayı sayfa çizilmeden önce uygula (açılışta renk sıçramasın) -->
  <script>
    try {
      if (localStorage.getItem("tema") === "aydinlik") {
        document.documentElement.classList.add("aydinlik");
      }
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=Courier+Prime:ital@0;1&family=Inter:wght@400;500&family=Lora:ital@0;1&family=Nunito:ital@0;1&family=Caveat:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <textarea id="not" placeholder="Rome wasn't built in a day." autofocus spellcheck="false" aria-label="Not"></textarea>

  <div id="menu">
    <button id="buyut" title="Yazıyı büyüt (Ctrl +)" aria-label="Yazıyı büyüt">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="kucult" title="Yazıyı küçült (Ctrl −)" aria-label="Yazıyı küçült">
      <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
    </button>
    <button id="fontSec" class="font-butonu" title="Fontu değiştir" aria-label="Fontu değiştir">Aa</button>
    <div class="ayrac"></div>
    <button id="tema" title="Temayı değiştir" aria-label="Temayı değiştir">
      <svg class="ikon-gunes" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ikon-ay" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button id="ses" title="Klavye sesi aç/kapat" aria-label="Klavye sesi aç/kapat">
      <svg class="ikon-ses-acik" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <svg class="ikon-ses-kapali" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m16 9 6 6M22 9l-6 6"/></svg>
    </button>
    <div class="ayrac"></div>
    <button id="txt" title=".txt olarak indir (Ctrl Shift S)" aria-label=".txt olarak indir">txt</button>
    <button id="md" title=".md olarak indir (Ctrl S)" aria-label=".md olarak indir">md</button>
    <div class="ayrac"></div>
    <button id="temizle" title="Notu sil" aria-label="Notu sil">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
    </button>
  </div>

  <div id="durum">
    <span id="sayac">0 kelime</span>
    <span id="kayitDurumu"></span>
  </div>

  <div id="bildirim" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
