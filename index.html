<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Not</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: #121212;
      color-scheme: dark;
      overflow: hidden;
    }

    #not {
      display: block;
      width: 100%;
      height: 100%;
      padding: 8vh 100px 8vh 5vw;
      background: transparent;
      color: #e0e0e0;
      caret-color: #e0e0e0;
      border: none;
      outline: none;
      resize: none;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 18px;
      line-height: 1.7;
      scrollbar-width: thin;
      scrollbar-color: #2a2a2a #121212;
    }

    #not::placeholder {
      color: #444;
    }

    #menu {
      position: fixed;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: opacity 0.4s;
    }

    #menu.gizli {
      opacity: 0;
      pointer-events: none;
    }

    #menu button {
      width: 36px;
      height: 36px;
      background: transparent;
      color: #777;
      border: 1px solid #333;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
    }

    #menu button:hover {
      color: #e0e0e0;
      border-color: #777;
    }

    #menu .kaydet {
      font-size: 11px;
      font-family: "Consolas", "Courier New", monospace;
    }

    #menu hr {
      border: none;
      border-top: 1px solid #333;
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <textarea id="not" placeholder="Rome wasn't built in a day." autofocus spellcheck="false"></textarea>

  <div id="menu">
    <button id="buyut" title="Yazıyı büyüt">+</button>
    <button id="kucult" title="Yazıyı küçült">−</button>
    <hr>
    <button id="txt" class="kaydet" title=".txt olarak kaydet">txt</button>
    <button id="md" class="kaydet" title=".md olarak kaydet">md</button>
  </div>

  <script>
    const not = document.getElementById("not");
    const menu = document.getElementById("menu");

    // Yazı boyutu
    let boyut = 18;

    function boyutAyarla(fark) {
      boyut = Math.min(40, Math.max(12, boyut + fark));
      not.style.fontSize = boyut + "px";
      not.focus();
    }

    document.getElementById("buyut").addEventListener("click", () => boyutAyarla(2));
    document.getElementById("kucult").addEventListener("click", () => boyutAyarla(-2));

    // Odak modu: yazarken menü gizlenir, 1 sn durunca geri gelir
    let zamanlayici;

    not.addEventListener("input", () => {
      menu.classList.add("gizli");
      clearTimeout(zamanlayici);
      zamanlayici = setTimeout(() => menu.classList.remove("gizli"), 1000);
    });

    // Kaydetme: notu dosyaya çevirip indir
    function kaydet(uzanti) {
      const tarih = new Date().toISOString().slice(0, 10);
      const dosya = new Blob([not.value], { type: "text/plain;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(dosya);
      link.download = "not-" + tarih + "." + uzanti;
      link.click();
      URL.revokeObjectURL(link.href);
      not.focus();
    }

    document.getElementById("txt").addEventListener("click", () => kaydet("txt"));
    document.getElementById("md").addEventListener("click", () => kaydet("md"));
  </script>
</body>
</html>
