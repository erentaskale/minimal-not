<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Not</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <textarea id="not" placeholder="Rome wasn't built in a day." autofocus spellcheck="false"></textarea>

  <div id="menu">
    <button id="buyut" title="Yazıyı büyüt">+</button>
    <button id="kucult" title="Yazıyı küçült">−</button>
    <hr>
    <button id="tema" title="Temayı değiştir">☀</button>
    <hr>
    <button id="txt" class="kaydet" title=".txt olarak kaydet">txt</button>
    <button id="md" class="kaydet" title=".md olarak kaydet">md</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
