<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Not</title>
  <meta name="description" content="Karanlık temalı, dikkat dağıtmayan minimalist not alma uygulaması.">

  <!-- Seçili temayı sayfa çizilmeden önce uygula (açılışta renk sıçramasın) -->
  <script>
    try {
      if (localStorage.getItem("tema") === "aydinlik") {
        document.documentElement.classList.add("aydinlik");
      }
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <textarea id="not" placeholder="Rome wasn't built in a day." autofocus spellcheck="false" aria-label="Not"></textarea>

  <div id="menu">
    <button id="buyut" title="Yazıyı büyüt (Ctrl +)" aria-label="Yazıyı büyüt">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="kucult" title="Yazıyı küçült (Ctrl −)" aria-label="Yazıyı küçült">
      <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
    </button>
    <div class="ayrac"></div>
    <button id="tema" title="Temayı değiştir" aria-label="Temayı değiştir">
      <svg class="ikon-gunes" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ikon-ay" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <div class="ayrac"></div>
    <button id="txt" title=".txt olarak indir (Ctrl Shift S)" aria-label=".txt olarak indir">txt</button>
    <button id="md" title=".md olarak indir (Ctrl S)" aria-label=".md olarak indir">md</button>
  </div>

  <div id="durum">
    <span id="sayac">0 kelime</span>
    <span id="kayitDurumu"></span>
  </div>

  <div id="bildirim" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
