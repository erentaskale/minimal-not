<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Not</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: #121212;
    }

    #not {
      width: 100%;
      height: 100%;
      padding: 8vh 12vw;
      background: transparent;
      color: #e0e0e0;
      caret-color: #e0e0e0;
      border: none;
      outline: none;
      resize: none;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 18px;
      line-height: 1.7;
    }

    #not::placeholder {
      color: #444;
    }
  </style>
</head>
<body>
  <textarea id="not" placeholder="Rome wasn't built in a day." autofocus spellcheck="false"></textarea>
</body>
</html>
